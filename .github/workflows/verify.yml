name: Verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The builder's toolchain is pinned in rust-toolchain.toml.
env:
  CARGO_TERM_COLOR: never
  RUST_TOOLCHAIN: "1.99"

jobs:
  changes:
    # A documentation-only pull request that no check reads skips the jobs
    # that need this one; .github/ci/docs_only.py decides, and the gate below
    # still reports.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.select.outputs.docs-only }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's parents give the pull request's changed paths.
          fetch-depth: 2
      - id: select
        run: python3 .github/ci/docs_only.py select --checked src/ --checked reference/ --checked evals/ --checked tests/ --checked tools/ >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: build parity and structural checks
          - os: windows-latest
            name: Windows build and installation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: tools/drdebits_build
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt

      - name: Restore the dependency build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/drdebits_build
          # Pull requests read main's cache and never write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint the builder
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run the builder tests
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --locked

      - name: Install the pinned cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none

      - name: Run the builder tests with line coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup component add llvm-tools-preview --toolchain "$RUST_TOOLCHAIN"
          cargo llvm-cov --locked --lcov --output-path coverage-codecov.lcov --fail-under-lines 92

      - name: Keep the coverage report for the Codecov upload
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: tools/drdebits_build/coverage-codecov.lcov
          retention-days: 1

      - name: Verify committed outputs against sources
        run: cargo run --locked --release --quiet -- verify --root ../..

      # actionlint finds the workflows from here and runs shellcheck over
      # their run: scripts; the repository tracks no shell files of its own.
      # Each release asset is checked against the digest recorded at pin time
      # (koalaman publishes no checksums file).
      - name: Lint the workflows with pinned actionlint and ShellCheck
        if: matrix.os == 'ubuntu-latest'
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | sha256sum --check
          tar -xJf "shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          ./actionlint -shellcheck "./shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

  secrets:
    name: secret and client-identifier scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans commits, so a shallow checkout would leave every
          # earlier commit unscanned.
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs. It is exempt from verify-gates: a Codecov outage must not
  # block merges.
  codecov:
    name: upload coverage to Codecov
    needs: verify
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-codecov.lcov
          disable_search: true
          fail_ci_if_error: true

  fuzzing:
    name: fuzz the YAML source reader
    # A 60-second random exploration is not a repeatable merge gate, so it
    # runs weekly and on demand rather than on pull requests or pushes.
    # verify-gates exempts this job, so a skipped run leaves main green.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/drdebits_build
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # libFuzzer instrumentation needs a nightly compiler; the date is pinned.
      - name: Install the pinned fuzzer
        env:
          CARGO_FUZZ_VERSION: "0.13.2"
          # install-action has no cargo-fuzz manifest, so the release asset is
          # checked against GitHub's digest for it at pin time.
          CARGO_FUZZ_SHA256: "b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c"
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-10-15 --profile minimal
          asset="cargo-fuzz-${CARGO_FUZZ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/rust-fuzz/cargo-fuzz/releases/download/${CARGO_FUZZ_VERSION}/$asset"
          echo "${CARGO_FUZZ_SHA256}  $asset" | sha256sum --check
          tar -xzf "$asset" -C "${CARGO_HOME:-$HOME/.cargo}/bin" cargo-fuzz
      # The release binary is built for musl and defaults to that target,
      # where the address sanitiser cannot build; fuzz on glibc instead.
      - name: Fuzz the source reader
        run: >-
          cargo +nightly-2026-10-15 fuzz run --target x86_64-unknown-linux-gnu sources fuzz/corpus --
          -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024

  verify-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every job it needs succeeded (or, on a documentation-only pull
    # request, skipped), when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [changes, verify, secrets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require every job to succeed, or skip on a documentation-only pull request
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/docs_only.py gate
      - name: Require every job to be listed and kept
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/verify.yml verify-gates --no-results --exempt codecov --exempt fuzzing
