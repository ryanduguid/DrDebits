name: No AI attribution

# Fails a pull request whose title, commit trailers, credit footers or author
# and committer identities carry AI authorship credit. A prose-only match in
# the description or a commit message is reported as a warning.
# Product references are allowed.
#
# The local commit-msg guard catches commits written on Ryan's machine; this
# workflow hands pull request metadata to the shared Attribution policy runner
# from the trusted base branch and audits commits on every branch push.
# It never runs pull request code.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # As release-policy's docs/attribution-consumers.md gives the caller: pull request
  # events queue per pull request and are never cancelled, since a cancelled run
  # leaves a cancelled check on the head (readying a PR cancelled the synchronize
  # run this way); each push or dispatch gets its own run key, so no audit of a
  # pushed range is dropped.
  group: attribution-${{ github.event_name }}-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  policy:
    name: Attribution policy
    # A branch deletion is also a push event, but GitHub then resolves
    # github.sha to the default branch tip, so the runner would scan an
    # unrelated range and post its status on an unrelated commit.
    if: ${{ github.event_name != 'push' || github.event.deleted != true }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: ryanduguid/release-policy/.github/workflows/attribution-policy.yml@ca5492bd09693be9e1fd47d980e2740ef8daf023
