name: Secrets

on:
  workflow_dispatch:
  # Pull requests use pull_request_target, never pull_request: it runs this
  # file and the action pin from the base branch, so a pull request that edits
  # them cannot drop its own scan. The action fetches the pull request's
  # commits as git objects and checks out or runs none of its files.
  pull_request_target: # zizmor: ignore[dangerous-triggers] scans PR commits as data; see above
  schedule:
    # Weekly full-history scan; pull requests and pushes scan only their commits.
    - cron: "47 5 * * 2"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Keyed on the commit for a push: every pushed revision gets its own scan.
  # Keying on the ref would let a rapid second push, or a scheduled run,
  # cancel an earlier scan, and those commits would then go unscanned.
  group: secrets-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      # The whole scan lives in the shared action: it checks out the full
      # history, installs a pinned betterleaks and scans with the shared rules
      # and this repository's .gitleaks.toml. A push scans the commits it adds
      # and a scheduled or manual run the full history. A pull request is
      # scanned twice, the second time with the base's .gitleaks.toml and
      # .gitleaksignore and with inline allow comments ignored, so it cannot
      # allowlist what it adds.
      - name: Scan for secrets and client identifiers
        uses: ryanduguid/release-policy/.github/actions/secrets-scan@d7039efe6d8c441f1f213c674902909e80535599 # v0.5.0
