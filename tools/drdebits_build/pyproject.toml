[project]
name = "drdebits-build"
version = "0.1.0"
description = "Deterministic build and verification tooling for the DrDebits guide"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyyaml==6.0.3"]

[project.optional-dependencies]
dev = [
    "ruff==0.12.8", "mypy==1.17.1","pytest==9.1.1"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drdebits_build*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["drdebits_build", "tests"]

[tool.ruff.lint]
# First-enablement set: syntax/undefined-name errors only. Keep Decimal("10.00")
# money literals; do not import-sort the existing test corpus in this change.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
packages = ["drdebits_build"]
ignore_missing_imports = true
pretty = true

