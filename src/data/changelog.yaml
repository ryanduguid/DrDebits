entries:
  - version: "0.7.0"
    date: "2026-11-14"
    status: "Unreleased"
    change: "Adds a workpaper record line for work where more than one model was asked: each model and its answer, whether they agreed and how any disagreement was resolved, and that agreement between models is not an independent check. Adds 4 behaviour tests (CALC-011, CALC-012, SRC-009 and WORK-004) on model agreement, Payday Super sources, super guarantee rounding and an unapproved sign-off, bringing the suite to 108 cases. No change to the control model, authority handling or human-decision boundaries; the builder's calculation check blocks more interrupted sums, dates and non-ASCII digits, and the repository gains an AI-use policy crosswalk and 2 naive benchmark baselines. Sources were not rechecked for this candidate: sources_checked_at and review_due are unchanged (14 October 2026; review due 14 January 2027). No confirmed model evaluation covers this candidate yet."
  - version: "0.6.0"
    date: "2026-11-12"
    status: "Published"
    change: "Adds an AI tool register and incident log to the AI-specific TPB rules, a rule to weigh a tribunal decision on another taxpayer’s facts as reasoning and never as settling the client’s position, and a rule to treat another jurisdiction’s terms, authorities and rules as unverified leads until an Australian primary source supports them; corrects the TPB interim suspension to allow more than one extension. Adds vendor checklist questions VA-38 to VA-47 on source authority, connectors, recordings and sharing, the APES 110 value chain start date and AUSTRAC’s table 6 examples in the AML/CTF intake classification. Adds 37 behaviour tests, bringing the suite to 104 cases. No change to the control model, authority handling or human-decision boundaries; the builder gains review checks for quoted spans and uncited authorities, a pre-run report and a block on calculations with unmatched brackets, and the repository gains a 31-question Payday Super and Division 7A benchmark with no scored run. Licensed under the Ryan Duguid Public Attribution Licence 1.0. Sources were not rechecked for this release: sources_checked_at and review_due are unchanged (14 October 2026; review due 14 January 2027). No confirmed model evaluation covers this release yet."
  - version: "0.5.0"
    date: "2026-10-31"
    status: "Published"
    change: "Adds a conditional automated-decision transparency check to the data and privacy gate for APP 1.7 to 1.9 of the Privacy Act 1988, which start on 10 December 2026, with vendor checklist question VA-37 and a matching row in the AI register entry; each leaves the legal conclusion to the firm. Adds 8 behaviour tests for output-side TFN and cross-client leaks and for assuming a flagged fact, bringing the suite to 67 cases, and a benchmark canary string in the evaluation files. No other model-facing guide control change; the builder gains a review check for untraced amounts (gate --facts) and a stricter prohibited-text screen. Sources were not rechecked for this release: sources_checked_at and review_due are unchanged (14 October 2026; review due 14 January 2027). No confirmed model evaluation covers this release yet."
  - version: "0.4.0"
    date: "2026-10-28"
    status: "Published"
    change: "Adds TPB sanctions controls and corrects the s 15 and s 45 rows for the Tax Agent Services Act and Code of Professional Conduct amendments that apply from 1 October 2026. Pins TASA C2026C00441 (Compilation No 27), TASR F2026C01004 (Compilation No 5) and the Code Determination F2026C00953 (Compilation No 4). Adds the AI tool and vendor assurance checklist and the TPB(GS) 55/2026 concordance. Clarifies decision statuses, evidence requirements, instruction handling and source verification, holds prohibited conclusions in hypotheticals, and adds calculator, citation and workpaper behaviour tests. Adds TPB Annual Report 2025-26 context to the source status. Relicenses the guide under FSL-1.1-ALv2; v0.3.3 and earlier stay CC BY 4.0. Sources checked 14 October 2026; review due 14 January 2027. No confirmed model evaluation covers this release yet."
  - version: "0.3.3"
    date: "2026-09-06"
    status: "Published"
    change: "Repository renamed from DrDebits to llm-tax-guardrails on 6 September 2026; the canonical repository in the metadata, CITATION.cff and llms.txt now name it (the old URL redirects). README opens with a worked behaviour test instead of a banner and badges. Sources were not rechecked for this release: sources_checked_at and review_due are unchanged. No control change."
  - version: "0.3.2"
    date: "2026-08-22"
    status: "Published"
    change: "First non-draft version stamp: metadata, header, CITATION.cff and end marker now identify the release as 0.3.2 current (the v0.3.1 GitHub release reused the 0.3.1-draft tree). Corrected the README description of DISCLAIMER.md (general disclaimer, not a TASA safe harbour), repointed the APES 110 and TPB hero badges at their reference maps, rebuilt the routing diagram from the guide's actual intake gate, risk classification, workflow and decision statuses, and scoped the digest wording to the files SHA256SUMS actually lists. AGENTS.md and llms.txt now route into the guide instead of paraphrasing it, and the intake gate consequences item defers to the risk-classification list. No control change."
  - version: "0.3.1-draft"
    date: "2026-08-18"
    status: "Published draft"
    change: "Wording patch: removed the duplicated action-list paraphrase from the deployment section, aligned the down-classification ban with the instruction-word vocabulary, and clarified the workflow preamble and PROP-002 phrasing. No control change."
  - version: "0.3.0-draft"
    date: "2026-08-18"
    status: "Published draft"
    change: "Scoped the output contract’s tool-action field to state-changing actions; wired the low-impact lane into the mandatory workflow and defined its outcome label; drew the boundary between human-performed consequential actions and the state-change gate and reworked AUTH-002 to match; added AML/CTF and APES 220 classification to the intake gate and workflow; added PROP-002, SAFE-001, CERT-001, BRE-001 and CONF-001 behaviour tests; brought `CITATION.cff` under the digest set; licensed the build tooling under MIT."
  - version: "0.2.0-draft"
    date: "2026-08-16"
    status: "Published draft"
    change: "Added APES 220, the TAA 1953 Sch 1 penalty and safe-harbour layer and an AML/CTF control set; added a low-impact proportionality lane; release integrity now rests on `SHA256SUMS` digests with the end marker demoted to a truncation check; behaviour tests, TPB catalogue, APES 110 map and maintenance protocol split into separate files; added PROP-001 and AML-001 behaviour tests."
  - version: "0.1.0-draft"
    date: "2026-08-16"
    status: "Published draft"
    change: "Initial source-backed guide; 55-statement TPB catalogue; APES 110 July 2025 mapping; AI, tax-planning, NOCLAR, privacy and independence controls; original DrDebits prose licensed under CC BY 4.0."
